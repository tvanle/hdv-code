// typed_judge.proto — design suy ra từ mô tả đề Q2112/Q2113/Q2122/Q2123/Q2132/Q2133.
// Nếu server thi dùng contract khác (tên field / số field / RPC tách rời), thay file
// này bằng .proto chính thức rồi mvn compile lại.

syntax = "proto3";
package GRPC;
option java_package = "GRPC";
option java_multiple_files = true;

import "judge.proto";   // tái sử dụng SubmitResponse

service TypedJudgeService {
  rpc RequestTyped (TypedRequest) returns (TypedData);
  rpc SubmitTyped  (TypedAnswer)  returns (SubmitResponse);
}

message TypedRequest {
  string student_code   = 1;
  string question_alias = 2;
}

// Server trả về 1 trong các typed data tuỳ question_alias — dùng oneof
message TypedData {
  string request_id = 1;
  oneof payload {
    TransactionRiskBatchData transaction_risk = 10;
    SensorTelemetryData      sensor_telemetry = 11;
    TextBatchData            text_batch       = 12;
    ShippingQuoteData        shipping_quote   = 13;
    EnrollmentData           enrollment       = 14;
  }
}

message TypedAnswer {
  string student_code   = 1;
  string question_alias = 2;
  string request_id     = 3;
  oneof payload {
    TransactionRiskAnswer transaction_risk = 10;
    SensorTelemetryAnswer sensor_telemetry = 11;
    TextBatchAnswer       text_batch       = 12;
    ShippingQuoteAnswer   shipping_quote   = 13;
    EnrollmentAnswer      enrollment       = 14;
  }
}

// ─── Q2112 — Transaction risk batch ────────────────────────────────────────
message Transaction {
  string transaction_id   = 1;
  double amount           = 2;
  int32  chargeback_count = 3;
  bool   new_device       = 4;
  string country          = 5;
}
message TransactionRiskBatchData {
  repeated Transaction transactions = 1;
}
message TransactionRiskAnswer {
  repeated string high_risk_transaction_ids = 1;
  int32  review_count                       = 2;
  double total_high_risk_amount             = 3;
}

// ─── Q2113 — Sensor telemetry window ───────────────────────────────────────
message SensorReading {
  string sensor_id = 1;
  double value     = 2;
  int64  timestamp = 3;
}
message SensorTelemetryData {
  double threshold = 1;
  repeated SensorReading readings = 2;
}
message SensorTelemetryAnswer {
  double average       = 1;
  double p95           = 2;
  int32  anomaly_count = 3;
}

// ─── Q2122 + Q2123 — Text batch (mode = ticket_tags / severity_counts) ─────
message TextBatchData {
  string mode = 1;
  repeated string entries = 2;
}
message TextBatchAnswer {
  repeated string   values = 1;
  map<string, int32> counts = 2;
}

// ─── Q2132 — Shipping quote ────────────────────────────────────────────────
message ShippingQuote {
  string carrier     = 1;
  double base_fee    = 2;
  double per_kg_fee  = 3;
  int32  eta_days    = 4;
  double reliability = 5;
}
message ShippingQuoteData {
  string order_id     = 1;
  double weight_kg    = 2;
  int32  max_eta_days = 3;
  repeated ShippingQuote quotes = 4;
}
message ShippingQuoteAnswer {
  string carrier   = 1;
  double total_fee = 2;
  int32  eta_days  = 3;
}

// ─── Q2133 — Enrollment eligibility ────────────────────────────────────────
message EnrollmentData {
  string student_id = 1;
  repeated string completed_courses = 2;
  repeated string required_courses  = 3;
  double gpa     = 4;
  double min_gpa = 5;
}
message EnrollmentAnswer {
  bool   eligible = 1;
  repeated string missing_courses = 2;
  double gpa_gap  = 3;
}
